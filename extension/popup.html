<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>IntDeliv</title>
<style>
  :root { --bg:#fff; --fg:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; --warn:#b45309; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111827; --fg:#f3f4f6; --muted:#9ca3af; --line:#374151; --accent:#60a5fa; } }
  body { margin:0; width:300px; font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 14px 8px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header img { width:22px; height:22px; }
  header b { font-size:14px; }
  .badge { margin-left:auto; font-size:11px; padding:2px 6px; border-radius:10px; background:#fef3c7; color:var(--warn); }
  .badge.live { background:#dcfce7; color:#15803d; }
  main { padding:10px 14px; }
  .row { display:flex; justify-content:space-between; padding:3px 0; }
  .row span:first-child { color:var(--muted); }
  .err { color:var(--err); font-size:12px; margin-top:6px; word-break:break-word; }
  .btns { display:flex; flex-direction:column; gap:6px; padding:10px 14px 14px; }
  button { font:inherit; padding:8px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.6; cursor:default; }
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><b>IntDeliv</b><span id="mode" class="badge">…</span></header>
<main>
  <div class="row"><span>Стан</span><span id="state">…</span></div>
  <div class="row"><span>Останній збір</span><span id="lastPoll">—</span></div>
  <div class="row"><span>Зібрано сьогодні</span><span id="collected">0</span></div>
  <div class="row"><span>Опубліковано сьогодні</span><span id="published">0</span></div>
  <div class="row"><span>У черзі</span><span id="queue">0</span></div>
  <div class="row"><span>Усього в базі</span><span id="total">0</span></div>
  <div class="row"><span>Потребують перевірки</span><span id="review">0</span></div>
  <div id="error" class="err" hidden></div>
</main>
<div class="btns">
  <button id="open" class="primary">Відкрити адмінку</button>
  <button id="sync">Синхронізувати зараз</button>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
